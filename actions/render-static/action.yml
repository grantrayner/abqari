name: Check static-site headers and checkout flows
description: Check the build and public production site, report header or checkout problems, and leave Render settings untouched.
inputs:
  config:
    description: Repository header and checkout check configuration
    default: deploy/render.json
  check-production:
    description: Also check the public production site; use false for pull requests
    default: 'true'
  browser-channel:
    description: 'chromium (downloaded) or chrome (already installed on the runner)'
    default: chromium
runs:
  using: composite
  steps:
    - name: Read expected headers from site configuration
      shell: bash
      env:
        SITE_CHECK_CONFIG: ${{ inputs.config }}
        ACTION_ROOT: ${{ github.action_path }}
      run: ruby "$ACTION_ROOT/header_policy.rb" "$SITE_CHECK_CONFIG"

    - name: Install pinned browser check dependencies
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        BROWSER_CHANNEL: ${{ inputs.browser-channel }}
      run: |
        npm ci --ignore-scripts --prefix "$ACTION_ROOT"
        case "$BROWSER_CHANNEL" in
          chromium) "$ACTION_ROOT/node_modules/.bin/playwright" install --with-deps chromium ;;
          chrome) google-chrome --version ;;
          *) echo 'Unsupported browser-channel; use chromium or chrome' >&2; exit 1 ;;
        esac

    - name: Check the built site under its expected headers
      shell: bash
      env:
        RENDER_DEPLOY_CONFIG: ${{ inputs.config }}
        ACTION_ROOT: ${{ github.action_path }}
        RENDER_CHECK_BROWSER: ${{ inputs.browser-channel }}
      run: node "$ACTION_ROOT/checkout_checks.mjs" local

    - name: Check public production headers and checkout paths
      if: ${{ inputs.check-production == 'true' }}
      shell: bash
      env:
        RENDER_DEPLOY_CONFIG: ${{ inputs.config }}
        ACTION_ROOT: ${{ github.action_path }}
        RENDER_CHECK_BROWSER: ${{ inputs.browser-channel }}
      run: node "$ACTION_ROOT/checkout_checks.mjs" live

    - name: Save check evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: site-header-checks-${{ github.sha }}
        path: deployment-evidence/
        if-no-files-found: warn
        retention-days: 14
