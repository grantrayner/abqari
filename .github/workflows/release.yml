# Push a new Abqari version to RubyGems on tag.
#
# Trigger: pushing a tag matching `v*.*.*` (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
# The workflow re-runs the full suite, verifies the tag matches the
# VERSION constant, builds the gem, and pushes it to RubyGems.
#
# Setup once per repo:
#   1. Get an API key from https://rubygems.org/profile/api_keys
#   2. Add it as the `RUBYGEMS_API_KEY` secret in GitHub repo Settings.
#   3. Enable MFA on your RubyGems account (`rubygems_mfa_required` is
#      set in the gemspec, so unsigned pushes from any account without
#      MFA will be rejected by RubyGems).

name: Release

# Third-party actions are SHA-pinned (not `@v5`-style floating tags).
# Floating tags on a workflow that holds `contents: write` and the
# RubyGems API key is a supply-chain hazard: an attacker who
# compromises any major-tag action can publish abqari on our behalf.
# Dependabot's `github-actions` ecosystem (.github/dependabot.yml)
# keeps these pins up to date — bumping them is a reviewable PR
# rather than a silent upstream release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install libvips with AVIF support
        # libheif1 + plugin packages are required for AVIF encoding —
        # libvips42 alone doesn't include them on Ubuntu 24.04.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42 libheif1 \
                                   libheif-plugin-aomenc \
                                   libheif-plugin-libde265 \
                                   libheif-plugin-dav1d

      - name: Install Pagefind (for site audit step)
        run: |
          curl -LSf https://pagefind.app/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches VERSION constant
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          expected="${TAG#v}"
          actual=$(ruby -Ilib -r abqari -e 'puts Abqari::VERSION')
          if [ "$actual" != "$expected" ]; then
            echo "Tag $TAG (=> version $expected) doesn't match lib/abqari.rb VERSION ($actual)" >&2
            exit 1
          fi

      # Mirror the PR-gate (`bin/check`): every check that gates a
      # PR also gates a release. Skipping the audit + dep-CVE check
      # at release time would let a regression that bypassed CI
      # (e.g. a [skip ci] merge) ship to RubyGems.
      - name: Run full test suite
        run: bundle exec bin/test

      - name: Run site audit (strict)
        env:
          ABQARI_ENV: production
        run: bundle exec bin/audit --strict

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Run bundle-audit (CVE check)
        run: bundle-audit check --update

      - name: Build gem
        run: gem build abqari.gemspec

      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem push abqari-*.gem

      - name: Upload .gem to release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{ steps.tag.outputs.tag }}
          path: abqari-*.gem
          retention-days: 90
