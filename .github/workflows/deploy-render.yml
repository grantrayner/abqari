name: Deploy Render with header and checkout checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.RENDER_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42 libheif1 libheif-plugin-aomenc libheif-plugin-libde265 libheif-plugin-dav1d
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Build and validate site
        env:
          ABQARI_ENV: production
          JEKYLL_ENV: production
        run: |
          bundle exec bin/build
          bundle exec ruby actions/render-static/test/render_static_test.rb
          node --test actions/render-static/test/policy.test.mjs
      - name: Check checkout, deploy, sync headers, and verify production
        uses: ./actions/render-static
        with:
          render-api-key: ${{ secrets.RENDER_API_KEY }}
