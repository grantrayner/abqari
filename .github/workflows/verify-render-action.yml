name: Verify Render deployment action
on:
  push:
    branches: [main]
    paths: ['actions/render-static/**', '.github/workflows/verify-render-action.yml']
  pull_request:
    paths: ['actions/render-static/**', '.github/workflows/verify-render-action.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bundle exec ruby actions/render-static/test/render_static_test.rb
      - run: node --test actions/render-static/test/policy.test.mjs
      - run: npm ci --ignore-scripts --prefix actions/render-static
      - run: actions/render-static/node_modules/.bin/playwright install --with-deps chromium
      - run: node actions/render-static/test/browser_gate.mjs
