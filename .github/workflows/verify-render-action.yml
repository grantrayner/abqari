name: Verify site header check action
on:
  push:
    branches: [main]
    paths: ['actions/render-static/**', '.github/workflows/verify-render-action.yml']
  pull_request:
    paths: ['actions/render-static/**', '.github/workflows/verify-render-action.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: bundle exec ruby actions/render-static/test/header_policy_test.rb
      - run: node --test actions/render-static/test/policy.test.mjs
      - run: node --test actions/render-static/test/browser_options.test.mjs
      - run: npm ci --ignore-scripts --prefix actions/render-static
      - run: actions/render-static/node_modules/.bin/playwright install --with-deps chromium
      - run: node actions/render-static/test/browser_gate.mjs
      - name: Verify the same CSP gate using the runner's Chrome
        env:
          RENDER_CHECK_BROWSER: chrome
        run: node actions/render-static/test/browser_gate.mjs
