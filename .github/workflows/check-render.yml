name: Check site headers and checkout
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-header-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42 libheif1 libheif-plugin-aomenc libheif-plugin-libde265 libheif-plugin-dav1d
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build and validate site
        env:
          ABQARI_ENV: production
          JEKYLL_ENV: production
        run: |
          bundle exec bin/build
          bundle exec ruby actions/render-static/test/header_policy_test.rb
          node --test actions/render-static/test/policy.test.mjs
      - name: Check headers, CSP, fonts, and checkout paths
        uses: ./actions/render-static
        with:
          check-production: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
