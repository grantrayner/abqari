name: Verify Cloudflare Ruby build
on:
  pull_request:
    paths:
      - '.cloudflare/build.sh'
      - '.github/workflows/cloudflare-build.yml'
      - 'wrangler.jsonc'
      - '.ruby-version'
      - 'Gemfile'
      - 'Gemfile.lock'
  push:
    branches: [main]
    paths:
      - '.cloudflare/build.sh'
      - '.github/workflows/cloudflare-build.yml'
      - 'wrangler.jsonc'
      - '.ruby-version'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips42 libheif1 libheif-plugin-aomenc libheif-plugin-libde265 libheif-plugin-dav1d
      - name: Build with the patched portable Ruby
        run: bash .cloudflare/build.sh
      - name: Validate the existing Worker deployment
        run: npx --yes wrangler@4.165.0 deploy --dry-run
