# Dependabot configuration.
#
# Controls how/when Dependabot opens version-update PRs. (Security-
# update PRs run independently of this file — they fire whenever a
# CVE is disclosed for one of your deps, regardless of cadence.)
#
# Cadence is weekly + grouped: one PR per ecosystem per week with all
# eligible bumps, instead of a separate PR per dep per day. For a
# small Ruby project with ~10 runtime deps and a handful of Actions,
# this keeps the inbox sane without missing meaningful updates.
#
# Major-version bumps stay opt-in: dev tools like minitest can roll
# major versions silently, but a major bump of commonmarker or
# ruby-vips usually involves real behaviour changes and deserves a
# manual upgrade. The `ignore` block below blocks majors on the
# runtime deps where regressions would surface in production.

version: 2
updates:
  # ----- Ruby gems --------------------------------------------------
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      # One PR per week with all eligible gem bumps. Easier to review
      # together than 10 separate PRs; one CI run instead of 10.
      ruby-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps on runtime-critical gems gated behind manual
      # upgrade — these change behaviour, not just API surface.
      - dependency-name: "commonmarker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ruby-vips"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rouge"
        update-types: ["version-update:semver-major"]
      - dependency-name: "erubi"
        update-types: ["version-update:semver-major"]

  # ----- GitHub Actions --------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
