<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A draft post">
  <!-- Fixture hero. Muted duotone + small meta line only: the page
       h1 carries the title, so the artwork doesn't repeat it (and
       doesn't bake a typeface that fights the active theme). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b5a42"/>
      <stop offset="1" stop-color="#8f7c5d"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#fff" stroke-width="2" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#hatch)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff" text-anchor="middle">
    <text x="800" y="470" font-size="40" opacity="0.85">Work in progress · only renders in development</text>
  </g>
</svg>
