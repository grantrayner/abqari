<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A future-dated post">
  <!-- Fixture hero. Muted duotone + small meta line only: the page
       h1 carries the title, so the artwork doesn't repeat it (and
       doesn't bake a typeface that fights the active theme). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46605e"/>
      <stop offset="1" stop-color="#6c8886"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.18">
    <circle cx="1320" cy="180" r="6"/>
    <circle cx="1380" cy="260" r="4"/>
    <circle cx="1450" cy="210" r="8"/>
    <circle cx="1260" cy="310" r="3"/>
    <circle cx="1500" cy="340" r="5"/>
    <circle cx="180" cy="700" r="6"/>
    <circle cx="240" cy="780" r="4"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff" text-anchor="middle">
    <text x="800" y="470" font-size="40" opacity="0.85">1 January 2099 · publishes when the date arrives</text>
  </g>
</svg>
