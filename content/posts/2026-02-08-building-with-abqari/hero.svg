<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Building with Abqari">
  <!-- Fixture hero. Muted duotone + motif only: the page h1 carries
       the title, so the artwork doesn't repeat it (and doesn't bake
       a typeface that fights the active theme). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5364"/>
      <stop offset="1" stop-color="#71809a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.12">
    <rect x="180" y="180" width="120" height="120" rx="6"/>
    <rect x="320" y="180" width="120" height="120" rx="6"/>
    <rect x="180" y="320" width="120" height="120" rx="6"/>
    <rect x="1160" y="600" width="120" height="120" rx="6"/>
    <rect x="1300" y="600" width="120" height="120" rx="6"/>
    <rect x="1300" y="740" width="120" height="120" rx="6"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff" text-anchor="middle">
    <text x="800" y="470" font-size="40" opacity="0.85">Posts, tags, and layouts — how the pieces fit together</text>
  </g>
</svg>
