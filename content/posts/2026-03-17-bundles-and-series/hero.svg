<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bundles and series">
  <!-- Fixture hero. Muted duotone + motif only: the page h1 carries
       the title, so the artwork doesn't repeat it (and doesn't bake
       a typeface that fights the active theme). The stacked, offset
       rectangles read as a bundle of volumes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d4a63"/>
      <stop offset="1" stop-color="#86718d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="6" opacity="0.22">
    <rect x="660" y="330" width="200" height="280" rx="8"/>
    <rect x="700" y="310" width="200" height="280" rx="8"/>
    <rect x="740" y="290" width="200" height="280" rx="8"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff" text-anchor="middle">
    <text x="800" y="700" font-size="40" opacity="0.85">grouping publications</text>
  </g>
</svg>
